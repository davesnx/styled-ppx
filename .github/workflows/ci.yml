name: Ppx CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OPAM_VERSION: 2.3.0
  DUNE_PROFILE: release

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # windows-latest
        ocaml-compiler:
          - 4.14.1
          - 5.4.0

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: ml-in-barcelona/gh-ci-action@v1.1.0
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          pins: |
            quickjs 0.5.1
            server-reason-react.0.4.1 https://github.com/ml-in-barcelona/server-reason-react.git#82c52e8a27dffa433f56753713bd699c9b31016b
          with-dev-setup: true
          extra-packages: dune-release

      - name: Load npm cache
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            demo/melange/node_modules
          key: npm-${{ matrix.os }}-${{ hashFiles('package-lock.json', 'demo/melange/package-lock.json') }}

      - name: Install npm dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: make install-npm

      - uses: ml-in-barcelona/gh-ci-action/dune-cache/load@v1.1.0

      - name: Build and test
        run: make test

      - name: Format
        if: matrix.ocaml-compiler == '5.4.0'
        run: make format-check

      - name: Release static
        run: make release-static

      - name: Upload artifacts for ${{ matrix.os }}
        uses: actions/upload-artifact@v4
        if: matrix.ocaml-compiler == '4.14.1'
        with:
          name: ${{ matrix.os }}
          path: _build/default/packages/bin/bin.exe

      - uses: ml-in-barcelona/gh-ci-action/dune-cache/save@v1.1.0

      - name: Release to opam
        uses: davesnx/dune-release-action@v0.4.0
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        with:
          packages: 'styled-ppx'
          changelog: './CHANGES.md'
          github-token: ${{ secrets.GH_TOKEN }}

#      - name: Run demo tests
#        run: make test-demo
