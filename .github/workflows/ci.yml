name: Ppx CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

env:
  OPAM_VERSION: 2.3.0
  DUNE_PROFILE: release

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  build:
    name: Build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest] # windows-latest
        ocaml-compiler:
          - 4.14.1
          - 5.4.0

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4

      - name: Setup OCaml and dependencies
        uses: ml-in-barcelona/gh-ci-action@v1.2.0
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          pins: |
            quickjs 0.5.1
            server-reason-react.0.4.1 https://github.com/ml-in-barcelona/server-reason-react.git#82c52e8a27dffa433f56753713bd699c9b31016b
          with-dev-setup: true

      - name: Install npm dependencies
        run: |
          npm install
          npm install --prefix demo/melange

      - name: Load dune cache
        uses: ml-in-barcelona/gh-ci-action/dune-cache/load@v1.2.0

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Format
        if: matrix.ocaml-compiler == '5.4.0'
        run: make format-check

      - name: Release static
        run: make release-static

      - name: Save dune cache
        uses: ml-in-barcelona/gh-ci-action/dune-cache/save@v1.2.0

      - name: Upload artifacts for ${{ matrix.os }}
        uses: actions/upload-artifact@v4
        if: matrix.ocaml-compiler == '4.14.1'
        with:
          name: ${{ matrix.os }}
          path: _build/default/packages/bin/bin.exe

      - name: Install dune-release
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        run: opam install dune-release -y

      - name: Release to opam
        uses: davesnx/dune-release-action@v0.4.0
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        with:
          packages: 'styled-ppx'
          changelog: './CHANGES.md'
          github-token: ${{ secrets.GH_TOKEN }}

      - name: Save npm cache
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: npm-${{ matrix.os }}-${{ hashFiles('package.json') }}

#      - name: Run demo tests
#        run: make test-demo
