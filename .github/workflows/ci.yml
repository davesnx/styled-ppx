name: Ppx CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  schedule:
    # Weekly run on main refreshes the caches before GitHub evicts them (7 days
    # without access), so pull requests can always restore them.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OPAM_VERSION: 2.3.0
  DUNE_PROFILE: release
  DUNE_CACHE: enabled
  # Hardlinking fails when the cache and the workspace are on different file
  # systems, and dune then stores nothing without an error.
  DUNE_CACHE_STORAGE_MODE: copy

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  build:
    name: Build
    strategy:
      matrix:
        # macOS runners are slow to start and to restore caches, so pull
        # requests only use them after merge.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }} # windows-latest
        ocaml-compiler:
          - 4.14.1
          - 5.4.0

    runs-on: ${{ matrix.os }}

    env:
      # The key covers everything that changes the switch. The setup-ocaml
      # version is not readable from `uses:`, bump it here with the action.
      OPAM_CACHE_PREFIX: opam-${{ matrix.os }}-${{ matrix.ocaml-compiler }}-setup-ocaml-3.9.0-
      DUNE_CACHE_PREFIX: dune-${{ matrix.os }}-${{ matrix.ocaml-compiler }}-

    steps:
      - uses: actions/checkout@v4

      - name: Load opam cache
        id: opam-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.tool_cache }}/opam
            ~/.opam
            _opam
            .opam-path
          key: ${{ env.OPAM_CACHE_PREFIX }}${{ hashFiles('*.opam', 'dune-project', 'Makefile') }}
          # An outdated switch is updated by `make pin install-opam`, much
          # faster than creating one from scratch.
          restore-keys: ${{ env.OPAM_CACHE_PREFIX }}

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3.9.0
        if: steps.opam-cache.outputs.cache-matched-key == ''
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: false
          opam-disable-sandboxing: true

      - name: Get OPAM executable path
        if: steps.opam-cache.outputs.cache-matched-key == ''
        uses: actions/github-script@v7
        with:
          script: |
            const opam_path = await io.which('opam', true);
            console.log('opam executable found: %s', opam_path);
            const Fs = require('fs/promises');
            await Fs.writeFile('.opam-path', opam_path, 'utf-8');
            console.log('stored path to .opam-path');

      - name: Use cached OPAM environment
        shell: bash
        run: |
          # https://github.com/ocaml/setup-ocaml/blob/b2105f9/packages/setup-ocaml/src/installer.ts#L33
          echo "OPAMVERBOSE=$RUNNER_DEBUG"   >> "$GITHUB_ENV"
          echo "OPAMCOLOR=always"            >> "$GITHUB_ENV"
          echo "OPAMCONFIRMLEVEL=unsafe-yes" >> "$GITHUB_ENV"
          echo "OPAMERRLOGLEN=0"             >> "$GITHUB_ENV"
          echo "OPAMPRECISETRACKING=1"       >> "$GITHUB_ENV"
          echo "OPAMYES=1"                   >> "$GITHUB_ENV"

          echo "OPAMROOT=$HOME/.opam"        >> "$GITHUB_ENV"

          OPAM_PATH="$(cat .opam-path)"
          chmod +x "$OPAM_PATH"
          dirname "$OPAM_PATH" >> "$GITHUB_PATH"

      - name: Install opam dependencies
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: make pin install-opam

      # Saved before building, so a failing test does not lose the switch.
      - name: Save opam cache
        uses: actions/cache/save@v4
        if: steps.opam-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.tool_cache }}/opam
            ~/.opam
            _opam
            .opam-path
          key: ${{ env.OPAM_CACHE_PREFIX }}${{ hashFiles('*.opam', 'dune-project', 'Makefile') }}

      - name: Load npm cache
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            demo/melange/node_modules
          key: npm-${{ matrix.os }}-${{ hashFiles('package-lock.json', 'demo/melange/package-lock.json') }}

      - name: Install npm dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: make install-npm

      - name: Load dune cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dune
          key: ${{ env.DUNE_CACHE_PREFIX }}${{ github.sha }}
          restore-keys: ${{ env.DUNE_CACHE_PREFIX }}

      - name: Measure dune cache
        id: dune-cache-before
        run: |
          # Explicit root: dune picks another default directory on macOS.
          echo "DUNE_CACHE_ROOT=$HOME/.cache/dune" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/dune"
          echo "kb=$(du -sk "$HOME/.cache/dune" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: make test

      - name: Format
        if: matrix.ocaml-compiler == '5.4.0'
        run: make format-check

      - name: Release static
        run: make release-static

      - name: Upload artifacts for ${{ matrix.os }}
        uses: actions/upload-artifact@v4
        if: matrix.ocaml-compiler == '4.14.1'
        with:
          name: ${{ matrix.os }}
          path: _build/default/packages/bin/bin.exe

      # Only a cache that gained entries is worth uploading, so a warm run
      # does not pay for a save.
      - name: Trim dune cache
        id: dune-cache-after
        if: ${{ !cancelled() }}
        run: |
          kb="$(du -sk "$HOME/.cache/dune" | cut -f1)"
          echo "grown=$(( kb > ${{ steps.dune-cache-before.outputs.kb }} + 1024 ))" >> "$GITHUB_OUTPUT"
          opam exec -- dune cache trim --size=2GB

      - name: Save dune cache
        uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.dune-cache-after.outputs.grown == '1' }}
        with:
          path: ~/.cache/dune
          key: ${{ env.DUNE_CACHE_PREFIX }}${{ github.sha }}

      - name: Install dune-release
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        run: opam install dune-release -y

      - name: Release to opam
        uses: davesnx/dune-release-action@v0.4.0
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        with:
          packages: 'styled-ppx'
          changelog: './CHANGES.md'
          github-token: ${{ secrets.GH_TOKEN }}

#      - name: Run demo tests
#        run: make test-demo
